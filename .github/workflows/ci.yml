name: CI

# Git Flow: every feature goes through a pull request into develop, and releases and hotfixes go into master.
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The 80% rule is enforced here with the coverage of the unit tests alone, which is lower than the merged
      # unit + instrumented coverage that contributors check locally, so passing here means passing there.
      - name: Run unit tests and enforce the coverage minimum
        run: ./gradlew testDebugUnitTest jacocoDebugCoverageReport jacocoDebugCoverageVerification

      # Pull requests from forks get a read-only token, which cannot comment.
      - name: Publish coverage on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: Madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/**/build/reports/jacoco/jacocoDebugCoverageReport/jacocoDebugCoverageReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit test coverage
          update-comment: true
          min-coverage-overall: 80
          min-coverage-changed-files: 80

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/jacocoDebugCoverageReport/'

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/reports/tests/testDebugUnitTest/'

  build:
    name: Lint and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run lint and build the release variants
        run: ./gradlew lintDebug lintRelease assembleRelease

      # The publishing plugin signs every release version, which needs the secrets, and nothing else. So the dry run
      # publishes the same AAR, sources jar, API documentation and POM to a local folder under a SNAPSHOT name. Signing
      # is exercised by the release workflow.
      - name: Publish to a local folder
        run: |
          release_version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          ./gradlew :fintoc-sdk:publishToMavenLocal \
            -PVERSION_NAME="${release_version%-SNAPSHOT}-SNAPSHOT" \
            -Dmaven.repo.local="$RUNNER_TEMP/fintoc-m2"

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'

      - name: Upload the library as a release would publish it
        uses: actions/upload-artifact@v7
        with:
          name: library-files
          path: ${{ runner.temp }}/fintoc-m2/mx/dev1/fintoc/

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The emulator exists only on the runner. Contributors run these tests on a physical device.
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: |
            **/build/reports/androidTests/connected/
            **/build/outputs/androidTest-results/connected/
